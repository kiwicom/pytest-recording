[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-recording"
version = "0.15.0"
description = "A pytest plugin powered by VCR.py to record and replay HTTP traffic"
keywords = ["pytest", "vcr", "network", "mock"]
authors = [{ name = "Dmitry Dygalo", email = "dmitry@dygalo.dev" }]
maintainers = [{ name = "Dmitry Dygalo", email = "dmitry@dygalo.dev" }]
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Operating System :: OS Independent",
]
dependencies = [
    "vcrpy>=4.0.2",
    "pytest>=6.2.5"
]
[project.optional-dependencies]
tests = [
    "pytest-httpbin",
    "pytest-mock",
    "requests",
    "Werkzeug==3.1.9"
]
dev = ["pytest_recording[tests]"]

[project.urls]
Documentation = "https://github.com/kiwicom/pytest-recording"
Changelog = "https://github.com/kiwicom/pytest-recording/blob/master/CHANGELOG.md"
"Bug Tracker" = "https://github.com/kiwicom/pytest-recording/issues"
"Source Code" = "https://github.com/kiwicom/pytest-recording"
Funding = "https://github.com/sponsors/Stranger6667"

[project.entry-points.pytest11]
recording = "pytest_recording.plugin"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests"]

[tool.coverage.run]
parallel = true
branch = true
source = ["pytest_recording"]

[tool.coverage.paths]
source = ["src/pytest_recording", ".tox/*/lib/python*/site-packages/pytest_recording"]

[tool.coverage.report]
show_missing = true
precision = 2
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "C", # flake8-comprehensions
    "B", # flake8-bugbear
    "D", # pydocstyle
    "I", # isort
    "T", # prints
    "FIX", # fixme comments
    "UP", # pyupgrade
    "SIM", # flake8-simplify
    "FURB", # refurb
    "PGH003", # blanket-type-ignore
]
ignore = [
    "E501", # Line too long, handled by ruff
    "B008", # Do not perform function calls in argument defaults
    "C901", # Too complex
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in `__init__`
    "D203", # One blank line before class
    "D213", # Multiline summary second line
    "D401", # Imperative mood
]

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
known-first-party = ["pytest_recording"]
known-third-party = ["_pytest", "packaging", "pytest", "vcr", "yaml"]
