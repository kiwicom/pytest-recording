name: Build

on:
  pull_request:
    paths:
      - '**.py'
      - '.github/workflows/build.yml'
      - 'codecov.yml'
      - 'pyproject.toml'
      - 'tox.ini'
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test ${{ matrix.tox-env || matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          # No PyPy on Windows: brotlicffi (needed by pytest-httpbin) fails to import there
          - os: ubuntu-24.04
            python: "pypy3.11"
            tox-env: pypy3-no_pycurl
          - os: ubuntu-24.04
            python: "3.10"
            tox-env: lowest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - run: pip install tox "coverage[toml]"

      - name: Install system deps on Linux
        if: runner.os == 'Linux'
        run: sudo apt update && sudo apt install -y libcurl4-openssl-dev libssl-dev

      # The `py` environment runs on the interpreter set up above.
      - run: tox -e ${{ matrix.tox-env || 'py' }}

      - run: coverage combine
      - run: coverage report
      - run: coverage xml -i

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
