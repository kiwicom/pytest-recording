[tox]
envlist = py{310,311,312,313,314,315},pypy3-no_pycurl,coverage-report

[testenv]
setenv =
    PYCURL_SSL_LIBRARY = {env:PYCURL_SSL_LIBRARY:openssl}
passenv =
    LDFLAGS
    CPPFLAGS
extras = tests
deps =
    coverage[toml]
    pycurl --global-option="--with-{env:PYCURL_SSL_LIBRARY}"
    xdist: pytest-xdist
commands =
    coverage run --source=pytest_recording -m pytest {posargs:tests}

# pypy3 + pycurl does not work
# https://github.com/pypy/pypy/issues/3958
[testenv:pypy3-no_pycurl]
deps = coverage[toml]

[testenv:lowest]
description = The lowest supported versions of direct dependencies.
basepython = python3.10
deps =
    coverage[toml]
    vcrpy==4.0.2
    pytest==6.2.5
    # VCR.py supports urllib3 2.x since 7.0.0
    urllib3<2

[testenv:coverage-report]
description = Report coverage over all measured test runs.
basepython = python3.14
deps = coverage[toml]
skip_install = true
depends = {py310,py311,py312,py313,py314,py315,pypy3}
commands =
    coverage combine
    coverage report --fail-under=100 --show-missing --skip-covered

[testenv:build]
deps = pep517
commands = python -m pep517.build --source . --binary --out-dir dist/
